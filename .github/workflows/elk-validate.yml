name: ELK validation # 독립 ELK 스택의 배포 전 검사입니다.

"on": # ELK 관련 변경에만 검사를 실행합니다.
  pull_request: # 일반 PR 컨텍스트에서 변경 코드를 검증합니다.
    paths: # 다른 인프라 변경만 있는 PR에는 실행하지 않습니다.
      - "observability/elk/**" # ELK 코드와 문서를 검사합니다.
      - ".github/workflows/elk-validate.yml" # 검사 절차의 변경도 검증합니다.
  push: # 브랜치에 커밋을 올릴 때에도 검사합니다.
    paths: # PR과 같은 대상 경로를 사용합니다.
      - "observability/elk/**" # ELK 코드와 문서를 검사합니다.
      - ".github/workflows/elk-validate.yml" # 검사 절차의 변경도 검증합니다.
  workflow_dispatch: # 필요하면 GitHub에서 수동으로 검사를 시작합니다.

permissions: # 토큰에는 저장소 읽기 권한만 부여합니다.
  contents: read # 체크아웃에 필요한 최소 권한입니다.

concurrency: # 같은 브랜치 또는 PR의 오래된 실행을 정리합니다.
  group: elk-validation-${{ github.workflow }}-${{ github.ref }} # 서로 다른 PR의 실행은 분리합니다.
  cancel-in-progress: true # 새 커밋이 오면 이전 검사를 중단합니다.

jobs: # AWS 배포 없이 수행하는 검증 작업입니다.
  validate: # Terraform과 런타임 정적 검사를 함께 수행합니다.
    runs-on: ubuntu-24.04 # Python 3와 Ruby가 포함된 GitHub 호스팅 이미지를 사용합니다.
    timeout-minutes: 20 # 도구 다운로드나 검사 정체 시간을 제한합니다.
    defaults: # 실행 명령의 공통 작업 위치를 지정합니다.
      run: # uses 단계에는 영향을 주지 않습니다.
        shell: bash # 오류와 파이프 오류를 실패로 처리하는 GitHub Bash 설정을 사용합니다.
        working-directory: observability/elk # 기존 envs 스택과 검사를 분리합니다.
    env: # 대화형 입력과 인스턴스 메타데이터 조회를 방지합니다.
      TF_IN_AUTOMATION: "true" # Terraform의 자동화 출력 모드를 사용합니다.
      TF_INPUT: "false" # 입력을 기다리지 않고 누락된 설정을 실패로 처리합니다.
      AWS_EC2_METADATA_DISABLED: "true" # EC2 메타데이터에서 자격 증명을 찾지 않습니다.
      PYTHONUTF8: "1" # 한국어 문서와 검사 출력을 UTF-8로 처리합니다.
    steps: # 순서대로 검사를 실행하고 실패 시 중단합니다.
      - name: Checkout # 현재 이벤트의 변경 내용을 가져옵니다.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 공식 v7.0.0 커밋으로 고정합니다.
        with: # 체크아웃 후 Git 인증 정보를 남기지 않습니다.
          persist-credentials: false # 검사 코드에 저장소 토큰을 저장해 주지 않습니다.
      - name: Set up Terraform # 검증한 Terraform CLI를 설치합니다.
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # 공식 v4.0.0 커밋으로 고정합니다.
        with: # CLI 버전과 래퍼 사용 여부를 명시합니다.
          terraform_version: "1.16.2" # 로컬 검증과 같은 버전을 사용합니다.
          terraform_wrapper: false # 원래 명령의 종료 코드를 그대로 사용합니다.
      - name: Check package and samples # 코드 주석·문서 링크·Python 문법·샘플 일치를 검사합니다.
        run: python3 tools/verify_package.py # 표준 라이브러리만 사용하며 AWS를 호출하지 않습니다.
      - name: Check shell syntax # 설치 스크립트를 실행하지 않고 문법만 검사합니다.
        run: bash -n runtime/00-install.sh # EC2 설치와 서비스 시작은 수행하지 않습니다.
      - name: Check normalization cases # 실제 정규화 함수에 합성 이벤트를 넣습니다.
        run: ruby tools/test-normalize.rb # 최소 Event shim의 13개 검증이며 실제 Logstash 통합 검사는 아닙니다.
      - name: Check YAML templates # 다섯 런타임 YAML 템플릿을 안전하게 파싱합니다.
        run: | # YAML 태그를 통한 객체 생성과 alias를 허용하지 않습니다.
          ruby -e 'require "yaml"; paths = Dir["runtime/templates/*.yml.in"]; abort "Expected five YAML templates" unless paths.length == 5; paths.each { |path| YAML.safe_load(File.read(path), permitted_classes: [], aliases: false); puts "PASS: #{path}" }' # 템플릿 문법만 검사하며 서비스 설정의 유효성은 배포 후 확인합니다.
      - name: Check Terraform formatting # 이 스택의 Terraform 파일만 확인합니다.
        run: terraform -chdir=terraform fmt -check -recursive # 파일을 수정하지 않고 형식 차이를 실패로 표시합니다.
      - name: Initialize Terraform without backend # 원격 상태에 연결하지 않고 공급자만 준비합니다.
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly -no-color # 커밋한 lock 파일의 버전과 체크섬을 사용합니다.
      - name: Validate Terraform # 공급자 스키마와 구성의 내부 일관성을 검사합니다.
        run: terraform -chdir=terraform validate -no-color # 실제 AWS 자원이나 IAM 권한의 유효성 검사는 아닙니다.
      - name: Run six mock plans # 명시한 테스트 파일의 AWS mock 계획만 실행합니다.
        run: terraform -chdir=terraform test -filter=tests/guide.tftest.hcl -no-color # 여섯 테스트는 모두 command=plan이며 AWS 배포를 하지 않습니다.
